<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Насколько хорошо ты меня знаешь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>

<div class="wrap">

  <!-- ── заставка ── -->
  <section class="screen on" id="s-intro">
    <div class="pre">три года спустя</div>
    <h1>Насколько хорошо<br>ты <em>меня</em> знаешь?</h1>
    <p class="lead">
      Двенадцать вопросов. За каждый правильный ответ открывается
      <b>один талон</b> в книжке — и чем дальше, тем они дороже.
      Талоны можно предъявить когда угодно.
    </p>
    <button class="big" id="start">начать</button>
    <button class="ghost" id="skip-to-book" hidden>моя книжка талонов →</button>
  </section>

  <!-- ── вопросы ── -->
  <section class="screen" id="s-quiz">
    <div class="meter">
      <div class="num" id="m-num">1 / 12</div>
      <div class="bar"><i id="m-bar" style="width:0"></i></div>
      <div class="score" id="m-score">0 ★</div>
    </div>
    <div class="q" id="q-text"></div>
    <div class="opts" id="q-opts"></div>
    <div class="note" id="q-note"></div>
    <button class="next" id="next">дальше →</button>
  </section>

  <!-- ── результат ── -->
  <section class="screen" id="s-result">
    <div class="pre">результат</div>
    <div class="score-big"><b id="r-num">0</b><span> / 12</span></div>
    <div class="verdict" id="r-title"></div>
    <p class="lead" id="r-sub"></p>
    <button class="big" id="to-book">открыть книжку талонов</button>
  </section>

  <!-- ── книжка талонов ── -->
  <section class="screen" id="s-book">
    <div class="book-head">
      <h2>Книжка талонов</h2>
      <p id="b-sub"></p>
    </div>
    <div id="b-list"></div>
    <p class="tip">Талон тратится один раз. </p>
    <button class="ghost" id="retry">пройти заново</button>
  </section>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
